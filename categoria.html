<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexo - Sección</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');

:root {
  --azul-principal: #0B3D91;
  --azul-acento: #00AEEF;
  --rojo-acento: #E30613;
  --gris-fondo: #F3F4F6;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Montserrat', Arial, sans-serif;
  background: var(--gris-fondo);
}

header {
  width: 100%;
  background: var(--azul-principal);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}

header a.volver {
  color: white;
  text-decoration: none;
  font-weight: 700;
  font-size: 14px;
}

header .logo-texto {
  color: white;
  font-weight: 900;
  font-size: 20px;
  letter-spacing: -1px;
}

.titulo-seccion {
  width: 100%;
  padding: 20px 24px 10px;
  font-size: 26px;
  font-weight: 800;
  color: var(--azul-principal);
  text-transform: uppercase;
  border-bottom: 3px solid var(--azul-acento);
  margin-bottom: 4px;
}

.lista {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 10px 24px 60px;
}

.noticia {
  display: flex;
  gap: 16px;
  align-items: center;
  padding: 18px 0;
  border-bottom: 1px solid #E5E7EB;
  text-decoration: none;
  color: #1F2937;
}

.noticia:hover { color: var(--azul-acento); }

.noticia .thumb {
  width: 130px;
  height: 130px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--azul-principal), var(--azul-acento));
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  background-size: cover;
  background-position: center;
}

.noticia .info h2 {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 6px;
}

.noticia .info .fuente {
  font-size: 12px;
  color: #9CA3AF;
  font-weight: 600;
}

.vacio {
  max-width: 900px;
  margin: 40px auto;
  padding: 0 24px;
  color: #6B7280;
  font-size: 15px;
}
</style>
</head>
<body>

<header>
  <a class="volver" href="index.html">&larr; Volver a Inicio</a>
  <span class="logo-texto">NEXO</span>
</header>

<div class="titulo-seccion" id="titulo-seccion">Sección</div>

<div class="lista" id="lista-noticias"></div>
<div class="vacio" id="mensaje-vacio" style="display:none;">
  Todavía no hay noticias cargadas para esta sección. Si acabás de conectar la fuente, esperá a que corra la actualización automática.
</div>

<script>
const NOMBRES_CATEGORIA = {
  "politica": "Política",
  "economia": "Economía",
  "deportes": "Deportes",
  "policiales_actualidad": "Policiales y Actualidad",
  "internacional": "Internacional",
  "espectaculos": "Espectáculos",
  "tecnologia": "Tecnología",
  "autos": "Autos",
  "turismo": "Turismo",
  "local": "La Plata"
};

const ICONO_CATEGORIA = {
  "politica": "📜",
  "economia": "💵",
  "deportes": "⚽",
  "policiales_actualidad": "🚨",
  "internacional": "🌎",
  "espectaculos": "🎬",
  "tecnologia": "💻",
  "autos": "🚗",
  "turismo": "✈️",
  "local": "📍"
};

function getCategoriaDeURL() {
  const params = new URLSearchParams(window.location.search);
  return params.get("cat") || "politica";
}

async function cargar() {
  const cat = getCategoriaDeURL();
  const nombre = NOMBRES_CATEGORIA[cat] || cat;
  document.getElementById("titulo-seccion").textContent = nombre;
  document.title = "Nexo - " + nombre;

  try {
    const resp = await fetch("news.json", { cache: "no-store" });
    const data = await resp.json();
    const items = (data.categorias && data.categorias[cat]) || [];

    if (!items.length) {
      document.getElementById("mensaje-vacio").style.display = "block";
      return;
    }

    const contenedor = document.getElementById("lista-noticias");
    items.forEach(noticia => {
      const a = document.createElement("a");
      a.className = "noticia";
      a.href = noticia.link || "#";
      a.target = "_blank";
      a.rel = "noopener";

      const thumb = document.createElement("div");
      thumb.className = "thumb";
      if (noticia.imagen) {
        thumb.style.backgroundImage = `url('${noticia.imagen}')`;
      } else {
        thumb.textContent = ICONO_CATEGORIA[cat] || "📰";
      }

      const info = document.createElement("div");
      info.className = "info";
      const h2 = document.createElement("h2");
      h2.textContent = noticia.titulo;
      const fuente = document.createElement("div");
      fuente.className = "fuente";
      fuente.textContent = noticia.fuente || "";
      info.appendChild(h2);
      info.appendChild(fuente);

      a.appendChild(thumb);
      a.appendChild(info);
      contenedor.appendChild(a);
    });
  } catch (e) {
    document.getElementById("mensaje-vacio").style.display = "block";
  }
}

cargar();
</script>
</body>
</html>
