name: Enviar newsletter diario

on:
  schedule:
    # Corre todos los días a las 12:00 UTC = 09:00 hora de Argentina.
    - cron: "0 12 * * *"
  workflow_dispatch:
    # Permite tocar el botón "Run workflow" en GitHub para probarlo a mano.

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Mandar el newsletter
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python scripts/send_newsletter.py
