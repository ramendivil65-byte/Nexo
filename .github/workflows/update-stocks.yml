name: Actualizar acciones

on:
  schedule:
    # Corre cada 30 minutos. La sintaxis es de cron, en horario UTC.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    # Permite tocar el botón "Run workflow" en GitHub para probarlo a mano.

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Traer acciones
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python -u scripts/fetch_stocks.py

      - name: Subir los cambios (si hay datos nuevos)
        run: |
          git config user.name "Nexo Bot"
          git config user.email "bot@users.noreply.github.com"
          git add stocks.json
          git diff --staged --quiet || git commit -m "Actualización automática de acciones"
          git push

