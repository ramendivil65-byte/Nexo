name: Actualizar noticias

on:
  schedule:
    # Corre cada 30 minutos. La sintaxis es de cron, en horario UTC.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    # Permite tocar el botón "Run workflow" en GitHub para probarlo a mano.

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Traer noticias
        run: python scripts/fetch_news.py

      - name: Subir los cambios (si hay noticias nuevas)
        run: |
          git config user.name "Nexo Bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "Actualización automática de noticias"
          git push
